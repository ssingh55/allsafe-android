      run: "set -euo pipefail\nBIN=\"$RUNNER_TEMP/bin/appknox\"; OUT=\"$RUNNER_TEMP/out\"\npick() { python3 - \"$1\" <<'EOF'\nimport glob, os, sys\nfs = [f for f in glob.glob(sys.argv[1] + \"/**/*\", recursive=True) if f.endswith((\".apk\", \".aab\", \".ipa\"))]\npref = [f for f in fs if \"universal\" in f] or [f for f in fs if \"arm64-v8a\" in f] or fs\nprint(max(pref, key=os.path.getsize) if pref else \"\")\nEOF\n}\nwait_scan() {\n  local id=\"$1\" deadline=$(( $(date +%s) + 90 * 60 )) resp code=\"\" body=\"\"\n  while :; do\n    if resp=$(curl -s --max-time 60 -H \"Authorization: Token $APPKNOX_ACCESS_TOKEN\" -w '\\n%{http_code}' \\\n        \"${APPKNOX_API_HOST}api/v3/files/${id}/scans_status_summary\"); then\n      code=\"${resp##*$'\\n'}\"; body=\"${resp%$'\\n'*}\"\n      case \"$code\" in\n        2??) [ \"$(echo \"$body\" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(int(bool(d.get(\"is_static_done\")) or d.get(\"static_scan_progress\",0)>=100))')\" = 1 ] && { echo\
        \ \"static scan of $id finished\"; return 0; } ;;\n        4??) echo \"::error::scan status for $id got HTTP $code\"; return 1 ;;\n      esac\n    fi\n    [ \"$(date +%s)\" -ge \"$deadline\" ] && { echo \"::error::scan $id not finished in 90m; last status: HTTP ${code:-none} ${body:0:400}\"; return 1; }\n    sleep 30\n  done\n}\nwait_knoxiq() {\n  local id=\"$1\" deadline=$(( $(date +%s) + 60 * 60 )) log\n  log=$(mktemp)\n  until \"$BIN\" autofix --file-id \"$id\" --list-analyses >\"$log\" 2>&1; do\n    [ \"$(date +%s)\" -ge \"$deadline\" ] && { echo \"::error::KnoxIQ of $id not completed in 60m\"; tail -5 \"$log\"; return 1; }\n    sleep 30\n  done\n  echo \"KnoxIQ triage of $id completed\"\n}\nanalyses() {\n  curl -sf --retry 5 -H \"Authorization: Token $APPKNOX_ACCESS_TOKEN\" \\\n    \"${APPKNOX_API_HOST}api/v2/files/$1/analyses?limit=200\" > \"$2\"\n  python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); sys.exit(d.get(\"count\",0) > len(d.get(\"results\",[])))' \"$2\"\
