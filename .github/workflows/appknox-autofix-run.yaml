        APPKNOX_ACCESS_TOKEN\"]}\ndeadline = time.time() + 40 * 60\nwhile time.time() < deadline:\n    try:\n        rows = json.load(urllib.request.urlopen(urllib.request.Request(url, headers=hdr), timeout=60))[\"results\"]\n    except OSError as e:\n        print(f\"submissions poll failed: {e}\", file=sys.stderr); rows = []\n    for s in rows:\n        if s.get(\"package_name\") != pkg or dt.datetime.fromisoformat(s[\"created_on\"].replace(\"Z\", \"+00:00\")) < start:\n            continue\n        if s.get(\"reason\"):\n            sys.exit(f\"submission {s['id']} rejected: {s['reason']}\")\n        if s.get(\"file\"):\n            print(s[\"file\"]); sys.exit(0)\n        print(f\"submission {s['id']}: {s.get('status_humanized')}\", file=sys.stderr)\n        break\n    time.sleep(20)\nsys.exit(f\"no file for {pkg} within 40m\")\nEOF\n}\nupload() {\n  local id pkg start\n  start=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)\n  id=$(\"$BIN\" upload \"$1\" --knoxiq | grep -E '^[0-9]+$' | tail -1)\
        \ || true\n  if ! [[ \"$id\" =~ ^[0-9]+$ ]]; then\n    pkg=$(pkgname \"$1\")\n    echo \"CLI returned no file id; waiting for the $pkg submission\" >&2\n    id=$(wait_submission \"$pkg\" \"$start\") || true\n  fi\n  [[ \"$id\" =~ ^[0-9]+$ ]] || { echo \"::error::no file id from upload of $1\" >&2; return 1; }\n  echo \"$id\"\n}\n\nart=$(pick \"$RUNNER_TEMP/art\")\n[ -n \"$art\" ] || { echo \"::error::the fix branch produced no build\"; exit 1; }\n# Resume: wait on a fix build that an earlier rescan already uploaded.\nif [ -n \"$EXISTING_AFTER_FILE_ID\" ]; then\n  [[ \"$EXISTING_AFTER_FILE_ID\" =~ ^[0-9]+$ ]] || { echo \"::error::existingAfterFileId must be a file id\"; exit 1; }\n  id=\"$EXISTING_AFTER_FILE_ID\"; echo \"reusing uploaded fix build $id\"\nelse\n  id=$(upload \"$art\")\nfi\nwait_scan \"$id\"\nwait_knoxiq \"$id\"\nanalyses \"$id\" \"$OUT/after.json\"\n# Re-fetch the baseline: KnoxIQ can rewrite risks after the first snapshot.\nanalyses \"$BEFORE_ID\" \"$OUT/before.json\"\
        \npython3 - \"$OUT/before.json\" \"$OUT/after.json\" \"$BEFORE_ID\" \"$id\" \"$FIX_BRANCH\" <<'EOF' | tee -a \"$GITHUB_STEP_SUMMARY\"\nimport json, sys\ndef risky(p):\n    return {a[\"vulnerability\"]: a.get(\"computed_risk\", 0) for a in json.load(open(p)).get(\"results\", []) if a.get(\"computed_risk\", 0) > 0}\nb, a = risky(sys.argv[1]), risky(sys.argv[2])\nres = {\"before_id\": int(sys.argv[3]), \"after_id\": int(sys.argv[4]), \"fix_branch\": sys.argv[5],\n       \"risky_before\": len(b), \"risky_after\": len(a),\n       \"fixed\": sorted(set(b) - set(a)), \"introduced\": sorted(set(a) - set(b)),\n       \"reduced\": sorted(v for v in set(a) & set(b) if a[v] < b[v])}\njson.dump(res, open(sys.argv[1].replace(\"before.json\", \"result.json\"), \"w\"), indent=1)\nprint(f\"### Autofix result\\n\\n- files: before {res['before_id']}, after {res['after_id']} ({res['fix_branch']})\\n\"\n      f\"- risky findings: **{res['risky_before']} -> {res['risky_after']}**\\n\"\n      f\"- fixed:\
        \ {res['fixed'] or 'none'}\\n- reduced: {res['reduced'] or 'none'}\\n- introduced: {res['introduced'] or 'none'}\")\nEOF\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: autofix-result
        path: ${{ runner.temp }}/out/
        retention-days: 14
