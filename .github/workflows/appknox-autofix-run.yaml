# Appknox autofix run: build -> scan + KnoxIQ -> autofix (Haiku) -> build fix -> rescan.
# Generated by appknox_copilot_core/autofix-arch-builds/gen-autofix.py. Do not hand-edit.
name: Appknox Autofix Run
'on':
  workflow_dispatch:
    inputs:
      fixerRef:
        description: appknox-go ref (branch, tag or FULL 40-char SHA)
        required: false
        default: ba6aabd044cd7f7ec110de1442af20b2fbefda88
      model:
        description: Model for autofix --model
        required: false
        default: claude-haiku-4-5
      reuseFixBranch:
        description: 'Rescan only: existing appknox-autofix/<name> branch (with reuseBeforeId)'
        required: false
        default: ''
      reuseBeforeId:
        description: 'Rescan only: baseline file id of that branch''s autofix run'
        required: false
        default: ''
      existingFileId:
        description: Skip the baseline upload and use this already-uploaded file id
        required: false
        default: ''
      existingAfterFileId:
        description: Skip the fix-build upload and rescan this already-uploaded file id
        required: false
        default: ''
permissions:
  contents: read
